<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>길드 신문</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="paper">
    <header class="top-ad-row">
      <section class="ad-box">
        <h2>오늘도 대환장</h2>
        <p>길드 생존 확인 전문지</p>
      </section>

      <section class="masthead">
        <h1>길드 신문</h1>
        <p>공지 · 모험 · 섬</p>
      </section>

      <section class="ad-box">
        <h2>놓치면 손해</h2>
        <p>오늘 정보 한눈에</p>
      </section>
    </header>

    <section class="meta-bar">
      <span>NO.001</span>
      <span id="date"></span>
      <span>길드 정보국</span>
    </section>

    <div id="error" class="error"></div>

    <section class="main-grid">
      <article class="headline-article">
        <h2>📢 공지사항</h2>
        <ul id="notices"></ul>
      </article>

      <aside class="side-article">
        <h2>🏝 오늘의 모험섬</h2>

        <div class="island-frame">
          <img id="islandImage" class="island-image" />
        </div>

        <ul id="islands"></ul>
      </aside>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
