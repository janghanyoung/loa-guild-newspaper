<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280, initial-scale=1.0" />
  <title>벼락장터 시세판</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="market-body-page">
  <main class="market-shell">
    <aside class="market-sidebar">
      <a class="market-logo" href="index.html">길드 신문</a>
      <nav class="market-nav">
        <a class="active" href="market.html">시세</a>
        <a href="index.html">공지</a>
        <a href="index.html">모험섬</a>
        <a href="index.html">공략</a>
      </nav>
      <div class="side-note">
        <strong>벼락장터</strong>
        <span>자동 갱신 시세판</span>
      </div>
    </aside>

    <section class="market-content">
      <header class="market-hero">
        <div>
          <p class="market-eyebrow">LOST ARK MARKET BOARD</p>
          <h1>거래소 시세</h1>
          <p>각인서부터 시작해서 보석·재료까지 확장할 시세판입니다.</p>
        </div>
        <div class="market-refresh-card">
          <span>최근 갱신</span>
          <strong id="marketDate">갱신일 로딩 중</strong>
        </div>
      </header>

      <div id="marketError" class="market-error"></div>

      <section class="market-tabs" aria-label="시세 카테고리">
        <button class="tab-button active" data-tab="engravings">각인</button>
        <button class="tab-button" data-tab="gems">보석</button>
        <button class="tab-button" data-tab="materials">재료</button>
        <button class="tab-button" data-tab="etc">기타</button>
      </section>

      <section class="market-summary-grid" id="marketSummary"></section>

      <section class="market-table-card">
        <div class="market-table-head">
          <div>
            <p class="market-eyebrow">LIVE WATCHLIST</p>
            <h2 id="marketTableTitle">각인 시세</h2>
          </div>
          <span>Open API 기준</span>
        </div>

        <table class="market-table">
          <thead>
            <tr>
              <th>품목</th>
              <th>분류</th>
              <th>현재가</th>
              <th>최저가</th>
              <th>전일대비</th>
              <th>메모</th>
            </tr>
          </thead>
          <tbody id="marketTableBody"></tbody>
        </table>
      </section>
    </section>
  </main>

  <script src="market.js"></script>
</body>
</html>
