name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      LOA_API_KEY: ${{ secrets.LOA_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python src/build_data.py

      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add public/daily.json
          git commit -m "update" || echo ok
          git push
